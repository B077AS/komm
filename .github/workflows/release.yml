# Release pipeline for Komm: the desktop client (repo root) and its launcher (launcher/), shipped as a
# self-updating install built with jpack (https://github.com/B077AS/jpack).
#
# Release flow (create a GitHub release with tag e.g. 0.0.3; a leading "v" is tolerated and stripped):
#   One job per platform (jpack builds for the machine it runs on: the Java runtime is made with that
#   machine's jlink, and the stub it ships is native). Each job
#     1. sets the Maven version from the tag (the tag is the single source of truth; app.properties'
#        client.version is filtered from it and jpack versions the release with it),
#     2. builds the launcher's fat jar for its OS (launcher/, version deliberately NOT bumped: the
#        launcher part is then byte-identical between releases until the launcher changes, so
#        installed copies don't download it again),
#     3. builds the client fat jar and runs `jpack:package` over both (-Ppackage,prod,jpack): a jlink
#        runtime shared by launcher and client, the install folder, and the release files,
#     4. wraps the install folder into the user-facing download - Komm-Setup-<v>.exe (Inno Setup) on
#        Windows, Komm-<v>-x86_64.AppImage (built by jpack itself, with its block index) on Linux,
#     5. attaches everything to the release.
#
#   Installed copies update from `releases/latest/download/` (updateUrl in src/jpack/jpack.json): the
#   stub fetches jpack-<platform>.json and then only the parts (jars / runtime / launcher / stub) whose
#   hash changed. So EVERY release must carry ALL files of target/jpack/release/, changed or not (a user
#   who skipped a version needs whichever parts changed since theirs). The manifest is uploaded LAST: the
#   parts it names must exist before anyone can see it.
#   Stable-named aliases (Komm-Setup.exe, Komm.AppImage) are uploaded too, so
#   `releases/latest/download/...` links on the hub site stay stable across versions.
#
# Manual flow (Actions tab -> Run workflow, tag = existing release e.g. 0.0.3):
#   Rebuilds both platforms from that tag's source and replaces their assets on the release. Use it when a
#   job failed or an asset is missing.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. 0.0.3) - rebuilds the Windows and Linux assets from that tag and replaces them on the release"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version from the release tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (installer + update files)
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set version from the tag
        run: mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build the launcher (Windows natives)
        run: mvn -B -ntp -f launcher/pom.xml clean package -Pwin-natives

      - name: Build the client and the jpack release
        run: mvn -B -ntp clean package -Ppackage,prod,jpack

      - name: Check the release files
        run: |
          ls -l target/jpack/release
          test -s target/jpack/release/jpack-windows-x64.json
          test -d target/jpack/image/windows-x64

      - name: Build the installer
        shell: pwsh
        run: |
          $repo = (Get-Location).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DImageDir=$repo\target\jpack\image\windows-x64" `
            "/DOutputDir=$repo\target\installer" `
            "$repo\launcher\packaging\windows\komm.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload to the release
        run: |
          # Stable alias so the hub site's releases/latest/download link never changes.
          cp "target/installer/Komm-Setup-$VERSION.exe" target/installer/Komm-Setup.exe
          # Parts first, the manifest last (see the header).
          find target/jpack/release -type f ! -name 'jpack-*.json' -print0 \
            | xargs -0 gh release upload "$TAG" --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" \
            "target/installer/Komm-Setup-$VERSION.exe" \
            target/installer/Komm-Setup.exe \
            --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" target/jpack/release/jpack-windows-x64.json --clobber -R "$GITHUB_REPOSITORY"

  linux:
    name: Linux (AppImage + update files)
    needs: version
    # Ubuntu 22.04 on purpose: the runtime that ships in the AppImage links against that glibc, so it
    # runs there and on newer systems (jpack's own Linux stub is built the same way).
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # appimagetool is itself an AppImage; jpack runs it with --appimage-extract-and-run, so no FUSE is
      # needed. Pinned to a release and checked against its SHA-256 (as in jpack's own workflow).
      - name: Get appimagetool
        run: |
          set -eu
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Set version from the tag
        run: mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build the launcher (Linux natives)
        run: mvn -B -ntp -f launcher/pom.xml clean package -Plinux-natives

      - name: Build the client and the jpack release
        run: mvn -B -ntp clean package -Ppackage,prod,jpack

      - name: Check the release files
        run: |
          ls -l target/jpack/release
          test -s target/jpack/release/jpack-linux-x64.json
          test -s "target/jpack/release/Komm-$VERSION-x86_64.AppImage"
          test -s "target/jpack/release/Komm-$VERSION-x86_64.AppImage.blocks"

      - name: Upload to the release
        run: |
          # Stable alias so the hub site's releases/latest/download link never changes.
          cp "target/jpack/release/Komm-$VERSION-x86_64.AppImage" target/Komm.AppImage
          # Parts first, the manifest last (see the header).
          find target/jpack/release -type f ! -name 'jpack-*.json' -print0 \
            | xargs -0 gh release upload "$TAG" --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" target/Komm.AppImage --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$TAG" target/jpack/release/jpack-linux-x64.json --clobber -R "$GITHUB_REPOSITORY"
