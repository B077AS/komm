# Release pipeline for Komm: the desktop client (repo root) and its launcher (launcher/).
#
# Release flow (create a GitHub release with tag e.g. 0.0.3):
#   1. jar        — sets the client's Maven version from the release tag (the tag is the
#                   single source of truth; app.properties' client.version is filtered
#                   from it; a leading "v" is tolerated and stripped), builds the fat jar
#                   and attaches it to the release. The launcher fetches this jar straight
#                   from the release (releases/latest via GitHub's API), verified against
#                   the SHA-256 digest GitHub reports for the asset.
#   2. launcher   — builds the launcher's own self-update jars from launcher/ with the SAME
#                   version (launcher.version == client.version) and attaches them:
#                   komm-launcher-windows.jar / komm-launcher-linux.jar. An installed
#                   launcher checks this repo's latest release for them on every start
#                   (launcher/.../UpdateManager); the client catches up launchers that
#                   can't (LauncherUpdateService).
#   3. installer / appimage — build the launcher from launcher/ (same commit), bundle the
#                   exact client jar from step 1 as the seed, and attach
#                   Komm-Setup-<v>.exe / Komm-<v>-x86_64.AppImage to the SAME release.
#                   Stable-named aliases (Komm-Setup.exe, Komm.AppImage) are uploaded too
#                   so `releases/latest/download/...` links stay stable across versions.
#
# Manual flow (Actions tab -> Run workflow, tag = existing release e.g. 0.0.3):
#   Skips the client jar build; rebuilds the launcher jars and the installers from the
#   launcher/ code of the branch the workflow runs on, against that release's
#   already-published client jar, and replaces those assets on it. Use this after
#   launcher-only changes.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. 0.0.3) — rebuilds the launcher jars + exe/AppImage from launcher/ and replaces them on that release"
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Resolve version from the release tag
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  jar:
    name: Client jar
    needs: version
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build fat jar (version from tag)
        run: |
          mvn -B versions:set -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B clean package -Ppackage,prod

      # Hands the exact released jar to the installer jobs of this run.
      - uses: actions/upload-artifact@v4
        with:
          name: client-jar
          path: target/komm-${{ needs.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            "target/komm-${{ needs.version.outputs.version }}.jar" \
            --clobber -R "$GITHUB_REPOSITORY"

  launcher:
    name: Launcher self-update jars
    needs: version
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set launcher version from the tag
        run: mvn -B -f launcher/pom.xml versions:set -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build Windows-native jar
        run: |
          mvn -B -f launcher/pom.xml clean package -Pwin-natives
          cp launcher/target/komm-launcher.jar komm-launcher-windows.jar

      - name: Build Linux-native jar
        run: |
          mvn -B -f launcher/pom.xml clean package -Plinux-natives
          cp launcher/target/komm-launcher.jar komm-launcher-linux.jar

      - name: Attach launcher jars to the release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            komm-launcher-windows.jar \
            komm-launcher-linux.jar \
            --clobber -R "$GITHUB_REPOSITORY"

  installer:
    name: Windows installer
    needs: [version, jar]
    # Runs after a successful jar build (release flow) or standalone when the jar
    # job was skipped (manual installers-only flow).
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.jar.result == 'success' || needs.jar.result == 'skipped') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set launcher version from the tag
        run: mvn -B -f launcher/pom.xml versions:set -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Get client jar (from this run)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: client-jar
          path: client-jar

      - name: Get client jar (from existing release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download "${{ needs.version.outputs.tag }}" \
            --pattern "komm-${{ needs.version.outputs.version }}.jar" \
            --dir client-jar -R "$GITHUB_REPOSITORY"

      - name: Build installer
        run: |
          echo "Building the installer from launcher/ at $(git rev-parse HEAD)"
          mvn -B -f launcher/pom.xml clean package -Pinstaller \
            "-Dclient.version=${{ needs.version.outputs.version }}" \
            "-Dclient.jar=${{ github.workspace }}\client-jar\komm-${{ needs.version.outputs.version }}.jar" \
            "-Discc.path=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Upload installer to the release
        run: |
          V="${{ needs.version.outputs.version }}"
          # Stable alias so the hub site's releases/latest/download link never changes.
          cp "launcher/target/installer/Komm-Setup-$V.exe" "launcher/target/installer/Komm-Setup.exe"
          gh release upload "${{ needs.version.outputs.tag }}" \
            "launcher/target/installer/Komm-Setup-$V.exe" \
            "launcher/target/installer/Komm-Setup.exe" \
            --clobber -R "$GITHUB_REPOSITORY"

  appimage:
    name: Linux AppImage
    needs: [version, jar]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.jar.result == 'success' || needs.jar.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set launcher version from the tag
        run: mvn -B -f launcher/pom.xml versions:set -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false

      - name: Get client jar (from this run)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: client-jar
          path: client-jar

      - name: Get client jar (from existing release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh release download "${{ needs.version.outputs.tag }}" \
            --pattern "komm-${{ needs.version.outputs.version }}.jar" \
            --dir client-jar -R "$GITHUB_REPOSITORY"

      - name: Install appimagetool
        run: |
          mkdir -p ~/.local/bin
          curl -Lo ~/.local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ~/.local/bin/appimagetool

      - name: Build AppImage
        run: |
          echo "Building the AppImage from launcher/ at $(git rev-parse HEAD)"
          mvn -B -f launcher/pom.xml clean package -Pappimage \
            "-Dclient.version=${{ needs.version.outputs.version }}" \
            "-Dclient.jar=$GITHUB_WORKSPACE/client-jar/komm-${{ needs.version.outputs.version }}.jar"

      - name: Upload AppImage to the release
        run: |
          V="${{ needs.version.outputs.version }}"
          # Stable alias so the hub site's releases/latest/download link never changes.
          cp "launcher/target/appimage/Komm-$V-x86_64.AppImage" "launcher/target/appimage/Komm.AppImage"
          gh release upload "${{ needs.version.outputs.tag }}" \
            "launcher/target/appimage/Komm-$V-x86_64.AppImage" \
            "launcher/target/appimage/Komm.AppImage" \
            --clobber -R "$GITHUB_REPOSITORY"
